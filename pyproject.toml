[project]
name = "flowdec-review"
version = "0.1.0"
description = "AMLT 2026 course project: review and testing of FlowDec (ICLR 2025) on custom data"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "librosa==0.10.2.post1",
    "soundfile==0.12.1",
    "matplotlib==3.9.0",
    "pandas==2.0.3",
    "tqdm==4.66.4",
    "einops==0.8.0",
    "omegaconf==2.3.0",
    "hydra-core==1.3.2",
    "torchdiffeq==0.2.3",
    "torchsde==0.2.6",
    "torchcde==0.2.5",
    "torchdyn==1.0.6",
    "torchmetrics==1.4.0.post0",
    "pytorch-lightning==2.3.3",
    "torchcfm==1.0.6",
    "descript-audio-codec==1.0.0",
    "pesq==0.0.4",
    "pystoi==0.4.1",
    "torch-pesq @ git+https://github.com/cobalamin/torch-pesq.git@6f7a2889d08ed4f4b56e0a94532631323a2bb86a",
    "torchcfm @ git+https://github.com/atong01/conditional-flow-matching.git@ec4da0846ddaf77e8406ad2fd592a6f0404ce5ae",
    "pysepm @ git+https://github.com/cobalamin/pysepm.git@defc47219af705a7052d382717f9b34072e8fcc4",
    "frechet-audio-distance>=0.1.6",
    "laion-clap>=1.1.6",
    "onnxruntime==1.18.0",
    "sounddevice==0.4.7",
    "jupyter==1.0.0",
    "ipywidgets==8.1.2",
    "seaborn==0.13.2",
    "beartype>=0.18",
    "setuptools==69.5.1",
    "speechmos==0.0.1.1",
    "ninja==1.11.1.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pyright>=1.1.380"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingImports = "warning"
# Third-party deps used here ship no type stubs (torchaudio, dac, pysepm,
# laion_clap, scipy, matplotlib, nbformat). Strict mode's unknown-type rules
# cannot be satisfied without hand-written stubs, so they are relaxed; all
# substantive type checks (arg/return types, operators, attributes) stay on.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportUntypedFunctionDecorator = false